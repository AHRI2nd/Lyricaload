<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E4BF5"/>
      <stop offset="1" stop-color="#4C3AED"/>
    </linearGradient>
    <style>
      text { font-family: 'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#121212"/>

  <g transform="translate(640,300)" text-anchor="middle">
    <!-- logo: indigo disc + lyric lines (middle line highlighted) -->
    <circle cx="0" cy="0" r="64" fill="url(#disc)"/>
    <g>
      <rect x="-22" y="-29" width="44" height="9"  rx="4.5" fill="#ffffff" fill-opacity="0.4"/>
      <rect x="-28" y="-6" width="56" height="12" rx="6"   fill="#ffffff"/>
      <rect x="-18" y="20" width="36" height="9"  rx="4.5" fill="#ffffff" fill-opacity="0.4"/>
    </g>

    <!-- wordmark -->
    <text x="0" y="172" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1">Lyricaload</text>

    <!-- subtitle -->
    <text x="0" y="222" font-size="30" font-weight="500" fill="#8a8a8a" letter-spacing="2">Local .lrc file loader</text>
  </g>
</svg>
